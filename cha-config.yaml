apiVersion: v1
kind: ConfigMap
metadata:
  name: cha-config
  namespace: cha-express
data:
  SHOP_NAME: "Rahim Mama's Cha"
  CITY: "Dhaka"
  THEME_COLOR: "#009639"
  OPENING_HOURS: "7 AM - 10 PM"
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Rahim Mama's Cha</title>
      <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 2rem; background: #f7f7f7; color: #333; }
        main { max-width: 720px; margin: auto; background: white; padding: 2rem; border-radius: 12px; }
        h1 { color: #009639; }
        li { padding: .5rem 0; border-bottom: 1px solid #eee; }
      </style>
    </head>
    <body>
      <main>
        <h1>Rahim Mama's Cha</h1>
        <p>Dhaka | Open: 7 AM - 10 PM</p>
        <h2>Tea Menu</h2>
        <ul>
          <li>Milk Tea — Tk 15</li>
          <li>Special Masala Tea — Tk 25</li>
          <li>Green Tea — Tk 20</li>
          <li>Ginger Tea — Tk 20</li>
          <li>Lemon Tea — Tk 15</li>
          <li>Malai Tea — Tk 30</li>
        </ul>
      </main>
    </body>
    </html>
